name = "tup"
version = "1.0.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[erlang]
# `ssl` has to be running before an `Ssl` transport works and `public_key` is
# called directly to read PEM. Listing them here puts them in the generated
# `.app`, so starting `tup` starts them.
extra_applications = ["ssl", "public_key"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
relay_supervisor = ">= 1.0.0-rc1 and < 2.0.0"
logging = ">= 1.5.0 and < 2.0.0"
exception = ">= 2.1.1 and < 3.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
